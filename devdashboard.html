<title>Developer Activity — Commits & Jira Time</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-2: #eb6834;
    --deemph: #b9b7af;
    --st-good: #0ca30c; --st-warn: #fab219; --st-crit: #d03b3b;
    --wash: rgba(11,11,11,0.045);
    --track: #cde2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --accent-2: #d95926;
      --deemph: #4a4a47;
      --wash: rgba(255,255,255,0.06);
      --track: #184f95;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-2: #d95926;
    --deemph: #4a4a47;
    --wash: rgba(255,255,255,0.06);
    --track: #184f95;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text-primary);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }
  a.home { color: var(--text-muted); text-decoration: none; font-size: 12.5px; }
  a.home:hover { color: var(--accent); }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 4px 0 14px; }
  header h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  .ghost-btn { background: none; border: 1px solid var(--border); color: var(--text-secondary);
               border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .ghost-btn:hover { background: var(--wash); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 4px 0 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .seg button { background: none; border: none; font: inherit; font-size: 13px; padding: 6px 11px;
                color: var(--text-secondary); cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--wash); }
  .seg button.on { background: var(--wash); color: var(--text-primary); font-weight: 600; }
  .filters select, .filters input[type="search"] {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .filters input[type="search"] { width: 250px; }
  .filters .spacer { flex: 1; }
  .hint { color: var(--text-muted); font-size: 12px; }
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .tile .lbl { color: var(--text-secondary); font-size: 12.5px; }
  .tile .val { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .tile .note { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 950px) { .charts2 { grid-template-columns: 1fr; } }
  .chart-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .chart-card .csub { color: var(--text-muted); font-size: 12px; margin: 1px 0 4px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .tbl-toggle { background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--text-secondary);
                font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; flex: none; }
  .tbl-toggle:hover { background: var(--wash); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 2px; }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; }
  .lkey { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .lswatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-body { position: relative; }
  .chart-body svg { display: block; width: 100%; height: auto; }
  .tooltip { position: absolute; pointer-events: none; background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
             box-shadow: 0 4px 14px rgba(0,0,0,0.13); font-size: 12.5px; min-width: 130px; display: none; z-index: 5; }
  .tooltip .tt-date { color: var(--text-muted); font-size: 11.5px; margin-bottom: 3px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
  .tooltip .tt-val { font-weight: 650; margin-left: auto; padding-left: 12px; }
  .tooltip .tt-name { color: var(--text-secondary); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .data-table th { text-align: left; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--grid); padding: 4px 8px; }
  .data-table td { border-bottom: 1px solid var(--grid); padding: 4px 8px; font-variant-numeric: tabular-nums; }
  .data-table td:first-child { font-variant-numeric: normal; }
  .data-table a { color: var(--accent); text-decoration: none; }
  .data-table a:hover { text-decoration: underline; }
  .muted { color: var(--text-muted); }
  .count-note { color: var(--text-muted); font-size: 12.5px; margin: 8px 2px; }
  .status-pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; background: var(--wash); white-space: nowrap; }

  /* jira allocation rows */
  .alloc-row { display: grid; grid-template-columns: 190px 1fr 150px; gap: 12px; align-items: center;
               padding: 7px 4px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 6px; }
  .alloc-row:hover { background: var(--wash); }
  .alloc-name { font-weight: 600; font-size: 13px; }
  .alloc-sub { color: var(--text-muted); font-size: 11.5px; }
  .meter { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--track) 45%, transparent); position: relative; overflow: hidden; }
  .meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 7px; }
  .alloc-val { font-size: 12.5px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
  .alloc-val b { color: var(--text-primary); }

  /* drawer */
  .drawer-veil { position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: 40; display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 94vw); z-index: 41;
            background: var(--surface-1); border-left: 1px solid var(--border);
            transform: translateX(102%); transition: transform 0.22s ease; overflow-y: auto; padding: 20px 22px 40px; }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 17px; margin: 6px 0 1px; }
  .drawer .close { position: absolute; top: 14px; right: 14px; }
  .drawer h4 { font-size: 13px; margin: 18px 0 6px; color: var(--text-secondary); font-weight: 600; }
  .mini-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .mini-kpis .mk { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
  .mini-kpis .mk .k { color: var(--text-muted); font-size: 11px; }
  .mini-kpis .mk .v { font-size: 17px; font-weight: 650; margin-top: 1px; }
  .issue-row { border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; margin-bottom: 6px; }
  .issue-row .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .issue-row a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 12.5px; }
  .issue-row a:hover { text-decoration: underline; }
  .issue-row .sum { font-size: 12.5px; margin-top: 2px; }
  .issue-row .hrs { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
  .hbar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--track) 45%, transparent); margin-top: 6px; position: relative; overflow: hidden; }
  .hbar .f { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
</style>
</head>

<script>
"use strict";
/* ---------------- csv ---------------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; } else field += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); field = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift();
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
const csvText = id => document.getElementById(id).textContent.trim();
const DEVS = parseCSV(csvText("csv-devs"));
const REPOS = parseCSV(csvText("csv-repos"));
const COMMITS = parseCSV(csvText("csv-commits")).map(c => ({ ...c, date: c.commit_date.slice(0, 10), add: +c.additions, del: +c.deletions }));
const ISSUES = parseCSV(csvText("csv-issues"));
const WORKLOGS = parseCSV(csvText("csv-worklogs")).map(w => ({ ...w, hours: +w.time_spent_hours }));
const devByLogin = new Map(DEVS.map(d => [d.github_login, d]));
const issueByKey = new Map(ISSUES.map(i => [i.issue_key, i]));
const MAX_DATE = COMMITS.reduce((m, c) => c.date > m ? c.date : m, "");
const CAPACITY_2W = 80;

/* ---------------- state / helpers ---------------- */
const state = { range: 90, repo: "all", dev: "all", q: "", emph: null };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const SVG = "http://www.w3.org/2000/svg";
const svgEl = (t, a) => { const e = document.createElementNS(SVG, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const shortDate = d => ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+d.slice(5,7)-1] + " " + +d.slice(8,10);
const fmtK = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(n >= 1e4 ? 0 : 1)+"K" : String(n);
const short = r => r.split("/")[1] || r;
function niceTicks(max, n = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(s => s * n >= max) || 10 * mag;
  const t = []; for (let v = 0; v <= max + 1e-9; v += step) t.push(+v.toFixed(6));
  if (t[t.length-1] < max) t.push(t[t.length-1] + step);
  return t;
}
// sequential blue ramp (light mode light->dark; dark mode dark->light)
const RAMP = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95","#0d366b"];
const isDark = () => matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.getAttribute("data-theme") !== "light" || document.documentElement.getAttribute("data-theme") === "dark";
function rampColor(v, max) {
  if (v <= 0) return null;
  const r = isDark() ? [...RAMP].reverse() : RAMP;
  const i = Math.min(r.length - 1, Math.floor((v / max) * r.length));
  return r[i];
}

function matchesSearch(d) {
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  const repos = [...new Set(COMMITS.filter(c => c.author_login === d.github_login).map(c => c.repo))].join(" ");
  return (d.github_login + " " + d.display_name + " " + d.role + " " + d.team + " " + repos).toLowerCase().includes(q);
}
function activeDevs() {
  return DEVS.filter(d => (state.dev === "all" || d.github_login === state.dev) && matchesSearch(d));
}
function commitsIn() {
  const logins = new Set(activeDevs().map(d => d.github_login));
  return COMMITS.filter(c => daysBetween(c.date, MAX_DATE) < state.range &&
    (state.repo === "all" || c.repo === state.repo) && logins.has(c.author_login));
}

/* ---------------- generic chart card scaffold ---------------- */
function cardScaffold(card, title, sub) {
  card.textContent = "";
  const head = el("div", "chart-head");
  const hl = el("div");
  hl.appendChild(el("h3", null, title));
  if (sub) hl.appendChild(el("div", "csub", sub));
  head.appendChild(hl);
  const tbtn = el("button", "tbl-toggle", "Table");
  head.appendChild(tbtn);
  card.appendChild(head);
  return tbtn;
}
function wireToggle(tbtn, body, tblWrap) {
  tbtn.addEventListener("click", () => {
    const showTbl = tblWrap.style.display === "none";
    tblWrap.style.display = showTbl ? "block" : "none";
    body.style.display = showTbl ? "none" : "block";
    tbtn.textContent = showTbl ? "Chart" : "Table";
  });
}
function mkTable(headers, rows) {
  const wrap = el("div"); wrap.style.display = "none"; wrap.style.maxHeight = "260px"; wrap.style.overflowY = "auto";
  const tbl = el("table", "data-table");
  const thead = el("thead"); const thr = el("tr");
  headers.forEach(h => thr.appendChild(el("th", null, h)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  rows.forEach(r => { const tr = el("tr"); r.forEach(v => tr.appendChild(el("td", null, String(v)))); tb.appendChild(tr); });
  tbl.appendChild(tb); wrap.appendChild(tbl);
  return wrap;
}

/* ---------------- KPI row ---------------- */
function renderKPIs() {
  const cs = commitsIn();
  const devs = activeDevs();
  const logins = new Set(devs.map(d => d.github_login));
  const wl = WORKLOGS.filter(w => logins.has(w.author_login));
  const hours = wl.reduce((a, w) => a + w.hours, 0);
  const adds = cs.reduce((a, c) => a + c.add, 0), dels = cs.reduce((a, c) => a + c.del, 0);
  const activeLogins = new Set(cs.map(c => c.author_login));
  const row = document.getElementById("kpiRow");
  row.textContent = "";
  function tile(l, v, n) {
    const t = el("div", "card tile");
    t.appendChild(el("div", "lbl", l));
    t.appendChild(el("div", "val", v));
    if (n) t.appendChild(el("div", "note", n));
    row.appendChild(t);
  }
  tile("Commits", cs.length.toLocaleString(), `last ${state.range} days`);
  tile("Active developers", String(activeLogins.size), `of ${DEVS.length} tracked`);
  tile("Repositories", String(new Set(cs.map(c => c.repo)).size), "with activity in range");
  tile("Lines changed", "+" + fmtK(adds) + " / −" + fmtK(dels), "additions / deletions");
  tile("Hours logged", hours.toFixed(0) + " h", "Jira worklogs · last 2 weeks");
  tile("Avg per developer", devs.length ? (hours / devs.length).toFixed(1) + " h" : "—", `of ${CAPACITY_2W} h capacity / 2 weeks`);
}

/* ---------------- leaderboard ---------------- */
function renderRank() {
  const card = document.getElementById("rankCard");
  const tbtn = cardScaffold(card, "Commit leaderboard", `Commits per developer · last ${state.range} days` + (state.repo !== "all" ? " · " + short(state.repo) : ""));
  const cs = commitsIn();
  const per = new Map();
  for (const c of cs) per.set(c.author_login, (per.get(c.author_login) || 0) + 1);
  const items = activeDevs().map(d => ({ d, n: per.get(d.github_login) || 0 }))
    .sort((a, b) => b.n - a.n);
  const body = el("div", "chart-body"); card.appendChild(body);
  const rowH = 32, LBL = 150, W = 560, MR = 64;
  const H = items.length * rowH + 6;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  body.appendChild(svg);
  const max = Math.max(...items.map(i => i.n), 1);
  const iw = W - LBL - MR;
  const accent = css("--accent");
  const tip = el("div", "tooltip"); body.appendChild(tip);
  items.forEach((it, i) => {
    const y = 3 + i * rowH;
    const nm = svgEl("text", { x: LBL - 12, y: y + rowH/2 + 1, "text-anchor": "end", "font-size": 12, "font-weight": 600, fill: css("--text-primary") });
    nm.textContent = it.d.display_name;
    svg.appendChild(nm);
    const sub = svgEl("text", { x: LBL - 12, y: y + rowH/2 + 12, "text-anchor": "end", "font-size": 9.5, fill: css("--text-muted") });
    sub.textContent = "@" + it.d.github_login;
    svg.appendChild(sub);
    const bw = Math.max(2, (it.n / max) * iw);
    const bh = 16, by = y + (rowH - bh)/2, r = Math.min(4, bw);
    svg.appendChild(svgEl("path", { d: `M${LBL} ${by} L${LBL+bw-r} ${by} Q${LBL+bw} ${by} ${LBL+bw} ${by+r} L${LBL+bw} ${by+bh-r} Q${LBL+bw} ${by+bh} ${LBL+bw-r} ${by+bh} L${LBL} ${by+bh} Z`,
      fill: state.emph && state.emph !== it.d.github_login ? css("--deemph") : accent }));
    const v = svgEl("text", { x: LBL + bw + 8, y: y + rowH/2 + 4, "font-size": 11.5, fill: css("--text-secondary"), style: "font-variant-numeric: tabular-nums" });
    v.textContent = String(it.n);
    svg.appendChild(v);
    const hit = svgEl("rect", { x: 0, y, width: W, height: rowH, fill: "transparent", cursor: "pointer" });
    hit.addEventListener("pointermove", () => {
      tip.textContent = "";
      tip.appendChild(el("div", "tt-date", it.d.display_name + " · " + it.d.team));
      const r1 = el("div", "tt-row"); r1.appendChild(el("span", "tt-name", "Commits")); r1.appendChild(el("span", "tt-val", String(it.n))); tip.appendChild(r1);
      const cs2 = cs.filter(c => c.author_login === it.d.github_login);
      const r2 = el("div", "tt-row"); r2.appendChild(el("span", "tt-name", "Lines")); r2.appendChild(el("span", "tt-val", "+" + fmtK(cs2.reduce((a,c)=>a+c.add,0)) + " / −" + fmtK(cs2.reduce((a,c)=>a+c.del,0)))); tip.appendChild(r2);
      tip.style.display = "block";
      tip.style.left = ((LBL / W) * body.clientWidth + 10) + "px";
      tip.style.top = Math.max(0, (y / H) * body.clientHeight - 8) + "px";
    });
    hit.addEventListener("pointerleave", () => tip.style.display = "none");
    hit.addEventListener("click", () => { state.emph = it.d.github_login; renderRank(); renderTrend(); openDrawer(it.d.github_login); });
    svg.appendChild(hit);
  });
  const tbl = mkTable(["Developer", "Login", "Team", "Commits", "Additions", "Deletions"],
    items.map(it => {
      const cs2 = cs.filter(c => c.author_login === it.d.github_login);
      return [it.d.display_name, it.d.github_login, it.d.team, it.n,
              cs2.reduce((a,c)=>a+c.add,0).toLocaleString(), cs2.reduce((a,c)=>a+c.del,0).toLocaleString()];
    }));
  card.appendChild(tbl);
  wireToggle(tbtn, body, tbl);
}

/* ---------------- weekly trend with emphasis ---------------- */
function weekKey(d) { const dt = new Date(d + "T00:00:00"); const day = (dt.getDay() + 6) % 7; dt.setDate(dt.getDate() - day); return dt.toISOString().slice(0, 10); }
function renderTrend() {
  const card = document.getElementById("trendCard").parentElement;
  card.textContent = "";
  const inner = el("div"); inner.id = "trendCard"; card.appendChild(inner);
  const emphDev = state.emph && devByLogin.get(state.emph) ? state.emph : null;
  const tbtn = cardScaffold(inner, "Weekly commit trend",
    emphDev ? devByLogin.get(emphDev).display_name + " highlighted — click another bar in the leaderboard to switch" : "Click a developer in the leaderboard to highlight their line");
  const cs = commitsIn();
  const weeks = [...new Set(cs.map(c => weekKey(c.date)))].sort();
  const perDev = new Map();
  for (const d of activeDevs()) perDev.set(d.github_login, weeks.map(() => 0));
  const wIdx = new Map(weeks.map((w, i) => [w, i]));
  for (const c of cs) { const a = perDev.get(c.author_login); if (a) a[wIdx.get(weekKey(c.date))]++; }

  const leg = el("div", "legend");
  if (emphDev) {
    const li1 = el("span", "li"); const k1 = el("span", "lkey"); k1.style.background = css("--accent");
    li1.appendChild(k1); li1.appendChild(document.createTextNode(devByLogin.get(emphDev).display_name));
    const li2 = el("span", "li"); const k2 = el("span", "lkey"); k2.style.background = css("--deemph");
    li2.appendChild(k2); li2.appendChild(document.createTextNode("Other developers"));
    leg.appendChild(li1); leg.appendChild(li2);
  } else {
    const li = el("span", "li"); const k = el("span", "lkey"); k.style.background = css("--deemph");
    li.appendChild(k); li.appendChild(document.createTextNode("One line per developer"));
    leg.appendChild(li);
  }
  inner.appendChild(leg);

  const body = el("div", "chart-body"); inner.appendChild(body);
  const W = 560, H = 250, ML = 36, MR = 26, MT = 12, MB = 26;
  const iw = W - ML - MR, ih = H - MT - MB;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  body.appendChild(svg);
  const n = weeks.length;
  const max = Math.max(...[...perDev.values()].flat(), 1);
  const ticks = niceTicks(max);
  const top = ticks[ticks.length-1];
  const X = i => ML + (n === 1 ? iw/2 : (i/(n-1)) * iw);
  const Y = v => MT + ih - (v/top) * ih;
  for (const t of ticks) {
    svg.appendChild(svgEl("line", { x1: ML, x2: W-MR, y1: Y(t), y2: Y(t), stroke: t === 0 ? css("--axis") : css("--grid"), "stroke-width": 1 }));
    const lb = svgEl("text", { x: ML-7, y: Y(t)+3.5, "text-anchor": "end", "font-size": 10.5, fill: css("--text-muted") });
    lb.textContent = String(t); svg.appendChild(lb);
  }
  const xe = Math.max(1, Math.ceil(n/6));
  weeks.forEach((wk, i) => {
    const isLast = i === n-1;
    if (i % xe === 0 && (isLast || i + xe <= n-1) || isLast) {
      const lb = svgEl("text", { x: isLast ? Math.min(X(i), W-4) : X(i), y: H-8, "text-anchor": isLast ? "end" : "middle", "font-size": 10.5, fill: css("--text-muted") });
      lb.textContent = shortDate(wk); svg.appendChild(lb);
    }
  });
  // gray lines first, emphasized last (draw order)
  const order = [...perDev.entries()].sort((a, b) => (a[0] === emphDev) - (b[0] === emphDev));
  for (const [login, vals] of order) {
    const isE = login === emphDev;
    const d = vals.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
    svg.appendChild(svgEl("path", { d, fill: "none", stroke: isE ? css("--accent") : css("--deemph"),
      "stroke-width": isE ? 2.4 : 1.4, opacity: isE ? 1 : 0.75, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (isE) svg.appendChild(svgEl("circle", { cx: X(vals.length-1), cy: Y(vals[vals.length-1]), r: 4, fill: css("--accent"), stroke: css("--surface-1"), "stroke-width": 2 }));
  }
  const cross = svgEl("line", { y1: MT, y2: MT+ih, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(cross);
  const tip = el("div", "tooltip"); body.appendChild(tip);
  svg.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect();
    const fx = ((ev.clientX - rect.left) / rect.width) * W;
    let best = 0, bd = 1e9;
    for (let i = 0; i < n; i++) { const dd = Math.abs(X(i) - fx); if (dd < bd) { bd = dd; best = i; } }
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best)); cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    tip.appendChild(el("div", "tt-date", "Week of " + shortDate(weeks[best])));
    const tot = [...perDev.values()].reduce((a, v) => a + v[best], 0);
    if (emphDev) {
      const r1 = el("div", "tt-row");
      const k = el("span", "lkey"); k.style.background = css("--accent"); r1.appendChild(k);
      r1.appendChild(el("span", "tt-name", devByLogin.get(emphDev).display_name));
      r1.appendChild(el("span", "tt-val", String(perDev.get(emphDev)[best])));
      tip.appendChild(r1);
    }
    const r2 = el("div", "tt-row");
    r2.appendChild(el("span", "tt-name", "All developers"));
    r2.appendChild(el("span", "tt-val", String(tot)));
    tip.appendChild(r2);
    tip.style.display = "block";
    const bw = body.clientWidth;
    tip.style.left = Math.min(bw - tip.offsetWidth - 4, Math.max(4, (X(best)/W)*bw + 12)) + "px";
    tip.style.top = "14px";
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });

  const tbl = mkTable(["Week", ...[...perDev.keys()].map(l => devByLogin.get(l).display_name)],
    weeks.map((wk, i) => [shortDate(wk), ...[...perDev.values()].map(v => v[i])]));
  inner.appendChild(tbl);
  wireToggle(tbtn, body, tbl);
}

/* ---------------- heatmap dev x repo ---------------- */
function renderHeat() {
  const card = document.getElementById("heatCard");
  const tbtn = cardScaffold(card, "Where the commits land",
    `Commits per developer per repository · last ${state.range} days · darker = more` + (isDark() ? " (lighter = more in dark mode)" : ""));
  const cs = commitsIn();
  const devs = activeDevs();
  const repos = REPOS.map(r => r.repo_full_name).filter(r => state.repo === "all" || r === state.repo);
  const m = new Map();
  for (const c of cs) m.set(c.author_login + "|" + c.repo, (m.get(c.author_login + "|" + c.repo) || 0) + 1);
  const max = Math.max(...m.values(), 1);
  const body = el("div", "chart-body"); card.appendChild(body);
  const cellW = 132, cellH = 30, LBL = 150, TOPB = 44;
  const W = LBL + repos.length * cellW + 10, H = TOPB + devs.length * cellH + 6;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  svg.style.maxWidth = (W * 1.15) + "px";
  body.appendChild(svg);
  const tip = el("div", "tooltip"); body.appendChild(tip);
  repos.forEach((r, j) => {
    const t = svgEl("text", { x: LBL + j*cellW + cellW/2 - 1, y: TOPB - 10, "text-anchor": "middle", "font-size": 11, fill: css("--text-secondary") });
    t.textContent = short(r); svg.appendChild(t);
  });
  devs.forEach((d, i) => {
    const t = svgEl("text", { x: LBL - 10, y: TOPB + i*cellH + cellH/2 + 4, "text-anchor": "end", "font-size": 11.5, fill: css("--text-primary") });
    t.textContent = d.display_name; svg.appendChild(t);
    repos.forEach((r, j) => {
      const v = m.get(d.github_login + "|" + r) || 0;
      const col = rampColor(v, max);
      const x = LBL + j*cellW + 1, y = TOPB + i*cellH + 1;
      const rect = svgEl("rect", { x, y, width: cellW - 2, height: cellH - 2, rx: 5,
        fill: col || "transparent", stroke: col ? "none" : css("--grid"), "stroke-width": col ? 0 : 1 });
      svg.appendChild(rect);
      const hit = svgEl("rect", { x: x-1, y: y-1, width: cellW, height: cellH, fill: "transparent" });
      hit.addEventListener("pointermove", () => {
        tip.textContent = "";
        tip.appendChild(el("div", "tt-date", d.display_name + " × " + short(r)));
        const rr = el("div", "tt-row");
        rr.appendChild(el("span", "tt-name", "Commits"));
        rr.appendChild(el("span", "tt-val", String(v)));
        tip.appendChild(rr);
        tip.style.display = "block";
        const bw = body.clientWidth, scale = Math.min(1, bw / W);
        tip.style.left = Math.min(bw - tip.offsetWidth - 4, (x + cellW) * scale) + "px";
        tip.style.top = (y * scale - 4) + "px";
      });
      hit.addEventListener("pointerleave", () => tip.style.display = "none");
      svg.appendChild(hit);
    });
  });
  const tbl = mkTable(["Developer", ...repos.map(short)],
    devs.map(d => [d.display_name, ...repos.map(r => m.get(d.github_login + "|" + r) || 0)]));
  card.appendChild(tbl);
  wireToggle(tbtn, body, tbl);
}

/* ---------------- jira allocation ---------------- */
function hoursByDev() {
  const h = new Map();
  for (const w of WORKLOGS) h.set(w.author_login, (h.get(w.author_login) || 0) + w.hours);
  return h;
}
function renderAlloc() {
  const card = document.getElementById("allocCard");
  const tbtn = cardScaffold(card, "Jira time allocation — last 2 weeks",
    `Hours logged on Jira worklogs vs ${CAPACITY_2W} h capacity · click a developer for their issues`);
  const h = hoursByDev();
  const openCnt = new Map();
  for (const i of ISSUES) openCnt.set(i.assignee_login, (openCnt.get(i.assignee_login) || 0) + 1);
  const body = el("div"); card.appendChild(body);
  const devs = activeDevs().map(d => ({ d, hrs: h.get(d.github_login) || 0 })).sort((a, b) => b.hrs - a.hrs);
  for (const { d, hrs } of devs) {
    const row = el("div", "alloc-row");
    const left = el("div");
    left.appendChild(el("div", "alloc-name", d.display_name));
    left.appendChild(el("div", "alloc-sub", `${openCnt.get(d.github_login) || 0} assigned issues · ${d.team}`));
    row.appendChild(left);
    const meter = el("div", "meter");
    const fill = el("div", "fill");
    fill.style.width = Math.min(100, (hrs / CAPACITY_2W) * 100).toFixed(1) + "%";
    meter.appendChild(fill);
    row.appendChild(meter);
    const val = el("div", "alloc-val");
    const b = el("b", null, hrs.toFixed(1) + " h");
    val.appendChild(b);
    val.appendChild(document.createTextNode(" · " + Math.round((hrs / CAPACITY_2W) * 100) + "% of 80 h"));
    row.appendChild(val);
    row.addEventListener("click", () => openDrawer(d.github_login));
    body.appendChild(row);
  }
  const tbl = mkTable(["Developer", "Assigned issues", "Hours logged (2w)", "% of capacity"],
    devs.map(({ d, hrs }) => [d.display_name, openCnt.get(d.github_login) || 0, hrs.toFixed(1), Math.round((hrs/CAPACITY_2W)*100) + "%"]));
  card.appendChild(tbl);
  wireToggle(tbtn, body, tbl);
}

/* ---------------- time by issue ---------------- */
function renderIssueTime() {
  const card = document.getElementById("issueTimeCard");
  card.textContent = "";
  const head = el("div", "chart-head");
  const hl = el("div");
  hl.appendChild(el("h3", null, "Where the time went — by Jira issue"));
  hl.appendChild(el("div", "csub", "Worklog hours per issue · last 2 weeks · links open in Jira"));
  head.appendChild(hl);
  card.appendChild(head);
  const logins = new Set(activeDevs().map(d => d.github_login));
  const per = new Map();
  for (const w of WORKLOGS) {
    if (!logins.has(w.author_login)) continue;
    const k = w.issue_key;
    if (!per.has(k)) per.set(k, { hrs: 0, devs: new Set(), last: "" });
    const e = per.get(k);
    e.hrs += w.hours; e.devs.add(w.author_login);
    if (w.started_date > e.last) e.last = w.started_date;
  }
  const items = [...per.entries()].sort((a, b) => b[1].hrs - a[1].hrs).slice(0, 14);
  const max = Math.max(...items.map(i => i[1].hrs), 1);
  const wrap = el("div"); wrap.style.maxHeight = "460px"; wrap.style.overflowY = "auto"; card.appendChild(wrap);
  const tbl = el("table", "data-table");
  const thead = el("thead"); const thr = el("tr");
  ["Issue", "Summary", "Developer(s)", "Hours"].forEach(x => thr.appendChild(el("th", null, x)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  for (const [key, e] of items) {
    const iss = issueByKey.get(key);
    const tr = el("tr");
    const td1 = el("td");
    const a = el("a", null, key);
    a.href = iss ? iss.url : "#"; a.target = "_blank"; a.rel = "noopener";
    td1.appendChild(a); tr.appendChild(td1);
    const td2 = el("td", null, iss ? iss.summary : "—");
    td2.style.maxWidth = "230px";
    tr.appendChild(td2);
    tr.appendChild(el("td", null, [...e.devs].map(l => devByLogin.get(l)?.display_name.split(" ")[0] || l).join(", ")));
    const td4 = el("td");
    td4.style.minWidth = "110px";
    td4.appendChild(document.createTextNode(e.hrs.toFixed(1) + " h"));
    const hb = el("div", "hbar"); const f = el("div", "f");
    f.style.width = ((e.hrs / max) * 100).toFixed(1) + "%";
    hb.appendChild(f); td4.appendChild(hb);
    tr.appendChild(td4);
    tb.appendChild(tr);
  }
  tbl.appendChild(tb); wrap.appendChild(tbl);
  if (per.size > items.length) card.appendChild(el("div", "count-note", `Showing top ${items.length} of ${per.size} issues with logged time — use the developer drawer for the full per-person list.`));
}

/* ---------------- drawer ---------------- */
function openDrawer(login) {
  const d = devByLogin.get(login); if (!d) return;
  const dr = document.getElementById("drawer");
  dr.textContent = "";
  const closeBtn = el("button", "ghost-btn close", "✕ Close");
  closeBtn.addEventListener("click", closeDrawer);
  dr.appendChild(closeBtn);
  dr.appendChild(el("div", "alloc-sub", d.role + " · " + d.team));
  dr.appendChild(el("h2", null, d.display_name));
  dr.appendChild(el("div", "alloc-sub", "@" + d.github_login + " · " + d.email + " · Jira account " + d.jira_account_id));

  const cs = COMMITS.filter(c => c.author_login === login && daysBetween(c.date, MAX_DATE) < state.range &&
    (state.repo === "all" || c.repo === state.repo));
  const hrs = WORKLOGS.filter(w => w.author_login === login).reduce((a, w) => a + w.hours, 0);
  const myIssues = ISSUES.filter(i => i.assignee_login === login);
  const kp = el("div", "mini-kpis");
  function mk(k, v) { const x = el("div", "mk"); x.appendChild(el("div", "k", k)); x.appendChild(el("div", "v", v)); kp.appendChild(x); }
  mk(`Commits (${state.range}d)`, String(cs.length));
  mk("Lines", "+" + fmtK(cs.reduce((a,c)=>a+c.add,0)) + " / −" + fmtK(cs.reduce((a,c)=>a+c.del,0)));
  mk("Repos", String(new Set(cs.map(c => c.repo)).size));
  mk("Assigned issues", String(myIssues.length));
  mk("Hours logged (2w)", hrs.toFixed(1) + " h");
  mk("Capacity used", Math.round((hrs / CAPACITY_2W) * 100) + "%");
  dr.appendChild(kp);

  // per-repo split
  dr.appendChild(el("h4", null, "Commits by repository"));
  const perRepo = new Map();
  for (const c of cs) perRepo.set(c.repo, (perRepo.get(c.repo) || 0) + 1);
  const rmax = Math.max(...perRepo.values(), 1);
  for (const [r, n] of [...perRepo.entries()].sort((a, b) => b[1] - a[1])) {
    const row = el("div", "alloc-row");
    row.style.gridTemplateColumns = "170px 1fr 60px";
    row.style.cursor = "default";
    row.appendChild(el("div", "alloc-sub", short(r)));
    const mtr = el("div", "meter"); mtr.style.height = "10px";
    const f = el("div", "fill"); f.style.width = ((n / rmax) * 100).toFixed(1) + "%";
    mtr.appendChild(f); row.appendChild(mtr);
    row.appendChild(el("div", "alloc-val", String(n)));
    dr.appendChild(row);
  }

  // jira issues with time
  dr.appendChild(el("h4", null, "Jira issues & time logged (last 2 weeks)"));
  const wlMine = WORKLOGS.filter(w => w.author_login === login);
  const hrsByIssue = new Map();
  for (const w of wlMine) hrsByIssue.set(w.issue_key, (hrsByIssue.get(w.issue_key) || 0) + w.hours);
  const imax = Math.max(...hrsByIssue.values(), 1);
  const sorted = [...myIssues].sort((a, b) => (hrsByIssue.get(b.issue_key) || 0) - (hrsByIssue.get(a.issue_key) || 0));
  for (const iss of sorted) {
    const box = el("div", "issue-row");
    const top = el("div", "top");
    const left = el("div");
    const a = el("a", null, iss.issue_key);
    a.href = iss.url; a.target = "_blank"; a.rel = "noopener";
    left.appendChild(a);
    left.appendChild(document.createTextNode(" "));
    const pill = el("span", "status-pill", iss.status);
    left.appendChild(pill);
    top.appendChild(left);
    const ih = hrsByIssue.get(iss.issue_key) || 0;
    top.appendChild(el("span", "hrs", ih ? ih.toFixed(1) + " h" : "no time logged"));
    box.appendChild(top);
    box.appendChild(el("div", "sum", iss.summary));
    box.appendChild(el("div", "alloc-sub", iss.issue_type + " · " + iss.priority + " · " + iss.story_points + " pts"));
    if (ih) {
      const hb = el("div", "hbar"); const f = el("div", "f");
      f.style.width = ((ih / imax) * 100).toFixed(1) + "%";
      hb.appendChild(f); box.appendChild(hb);
    }
    dr.appendChild(box);
  }

  // recent commits
  dr.appendChild(el("h4", null, "Recent commits"));
  const tbl = el("table", "data-table");
  const thead = el("thead"); const thr = el("tr");
  ["Date", "Repo", "Message", "±"].forEach(x => thr.appendChild(el("th", null, x)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  for (const c of cs.slice(-8).reverse()) {
    const tr = el("tr");
    tr.appendChild(el("td", null, shortDate(c.date)));
    tr.appendChild(el("td", null, short(c.repo)));
    const tdm = el("td", null, c.message); tdm.style.maxWidth = "220px"; tdm.style.overflow = "hidden"; tdm.style.textOverflow = "ellipsis"; tdm.style.whiteSpace = "nowrap";
    tr.appendChild(tdm);
    tr.appendChild(el("td", null, "+" + c.add + "/−" + c.del));
    tb.appendChild(tr);
  }
  tbl.appendChild(tb); dr.appendChild(tbl);

  document.getElementById("veil").style.display = "block";
  dr.classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("veil").style.display = "none";
}
document.getElementById("veil").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ---------------- wiring ---------------- */
document.getElementById("rangeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.range = +b.dataset.r;
  document.querySelectorAll("#rangeSeg button").forEach(x => x.classList.toggle("on", x === b));
  renderAll();
});
document.getElementById("fRepo").addEventListener("change", e => { state.repo = e.target.value; renderAll(); });
document.getElementById("fDev").addEventListener("change", e => { state.dev = e.target.value; state.emph = e.target.value === "all" ? state.emph : e.target.value; renderAll(); });
let qT;
document.getElementById("fSearch").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; renderAll(); }, 140); });
(function init() {
  const rSel = document.getElementById("fRepo");
  REPOS.forEach(r => { const o = el("option", null, short(r.repo_full_name)); o.value = r.repo_full_name; rSel.appendChild(o); });
  const dSel = document.getElementById("fDev");
  DEVS.forEach(d => { const o = el("option", null, d.display_name); o.value = d.github_login; dSel.appendChild(o); });
})();
const themeBtn = document.getElementById("themeBtn");
const themes = ["auto", "light", "dark"]; let ti = 0;
themeBtn.addEventListener("click", () => {
  ti = (ti + 1) % 3; const t = themes[ti];
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  renderAll();
});
function renderAll() {
  document.getElementById("filterHint").textContent =
    `${commitsIn().length} commits · ${activeDevs().length} developers · window ending ${shortDate(MAX_DATE)}`;
  renderKPIs(); renderRank(); renderTrend(); renderHeat(); renderAlloc(); renderIssueTime();
}
renderAll();
</script>
