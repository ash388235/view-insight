<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas EOD Batch — Data Point Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-in: #2a78d6;   /* inputs  — categorical slot 1 */
    --series-out: #eb6834;  /* outputs — categorical slot 2 */
    --st-good: #0ca30c;
    --st-warn: #fab219;
    --st-crit: #d03b3b;
    --wash: rgba(11,11,11,0.045);
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --series-in: #3987e5;
      --series-out: #d95926;
      --wash: rgba(255,255,255,0.06);
      --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --series-in: #3987e5;
    --series-out: #d95926;
    --wash: rgba(255,255,255,0.06);
    --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px; line-height: 1.45;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 24px 60px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  header h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  .hbtns { display: flex; gap: 8px; }
  .ghost-btn {
    background: none; border: 1px solid var(--border); color: var(--text-secondary);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ghost-btn:hover { background: var(--wash); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--grid); margin-bottom: 14px; }
  .tab {
    background: none; border: none; font: inherit; font-size: 14px; cursor: pointer;
    color: var(--text-secondary); padding: 8px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text-primary); }
  .tab.active { color: var(--text-primary); font-weight: 600; border-bottom-color: var(--accent); }

  /* ---------- filter row ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 0 16px;
  }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .seg button {
    background: none; border: none; font: inherit; font-size: 13px; padding: 6px 11px;
    color: var(--text-secondary); cursor: pointer; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--wash); }
  .seg button.on { background: var(--wash); color: var(--text-primary); font-weight: 600; }
  .filters select, .filters input[type="search"] {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  }
  .filters input[type="search"] { width: 320px; }
  .filters .spacer { flex: 1; }
  .hint { color: var(--text-muted); font-size: 12px; }

  /* ---------- cards / layout ---------- */
  .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .tile .lbl { color: var(--text-secondary); font-size: 12.5px; }
  .tile .val { font-size: 26px; font-weight: 650; margin-top: 2px; }
  .tile .delta { font-size: 12px; margin-top: 1px; }
  .tile .delta.up { color: var(--st-good); }
  .tile .delta.down { color: var(--st-crit); }
  .tile .delta.flat { color: var(--text-muted); }
  .tile svg { display: block; margin-top: 6px; }
  .charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  @media (max-width: 900px) { .charts2 { grid-template-columns: 1fr; } }
  .chart-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .chart-card .csub { color: var(--text-muted); font-size: 12px; margin: 1px 0 4px; }
  .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .tbl-toggle {
    background: none; border: 1px solid var(--border); border-radius: 7px; color: var(--text-secondary);
    font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; flex: none;
  }
  .tbl-toggle:hover { background: var(--wash); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-secondary); margin: 4px 0 2px; }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; }
  .lkey { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .lswatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart-body { position: relative; }
  .chart-body svg { display: block; width: 100%; height: auto; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.13); font-size: 12.5px; min-width: 130px;
    display: none; z-index: 5;
  }
  .tooltip .tt-date { color: var(--text-muted); font-size: 11.5px; margin-bottom: 3px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 2px; }
  .tooltip .tt-val { font-weight: 650; margin-left: auto; padding-left: 12px; }
  .tooltip .tt-name { color: var(--text-secondary); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .data-table th { text-align: left; color: var(--text-muted); font-weight: 500; border-bottom: 1px solid var(--grid); padding: 4px 8px; }
  .data-table td { border-bottom: 1px solid var(--grid); padding: 4px 8px; font-variant-numeric: tabular-nums; }
  .data-table td:first-child { font-variant-numeric: normal; }

  /* ---------- main data point table ---------- */
  .dp-table-wrap { overflow-x: auto; }
  table.dp { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dp th {
    text-align: left; font-weight: 500; color: var(--text-muted); font-size: 12px;
    border-bottom: 1px solid var(--grid); padding: 7px 10px; white-space: nowrap; cursor: pointer; user-select: none;
  }
  table.dp th:hover { color: var(--text-primary); }
  table.dp th .arr { font-size: 10px; }
  table.dp td { border-bottom: 1px solid var(--grid); padding: 7px 10px; vertical-align: middle; }
  table.dp tbody tr { cursor: pointer; }
  table.dp tbody tr:hover { background: var(--wash); }
  table.dp td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .dp-name { font-weight: 600; }
  .dp-id { color: var(--text-muted); font-size: 11.5px; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    border-radius: 999px; padding: 2px 9px; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .b-in  { background: color-mix(in srgb, var(--series-in) 12%, transparent); color: var(--text-primary); }
  .b-out { background: color-mix(in srgb, var(--series-out) 14%, transparent); color: var(--text-primary); }
  .chip {
    display: inline-block; font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px;
    padding: 1px 8px; margin: 1px 2px 1px 0; color: var(--text-secondary); background: none; cursor: pointer; font-family: inherit;
  }
  .chip:hover { background: var(--wash); color: var(--text-primary); }
  .status-cell { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
  .st-ic { font-weight: 700; font-size: 11px; }
  .muted { color: var(--text-muted); }
  .count-note { color: var(--text-muted); font-size: 12.5px; margin: 8px 2px; }

  /* ---------- drawer ---------- */
  .drawer-veil { position: fixed; inset: 0; background: rgba(0,0,0,0.28); z-index: 40; display: none; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 94vw); z-index: 41;
    background: var(--surface-1); border-left: 1px solid var(--border);
    transform: translateX(102%); transition: transform 0.22s ease; overflow-y: auto; padding: 20px 22px 40px;
  }
  .drawer.open { transform: none; }
  .drawer h2 { font-size: 17px; margin: 4px 0 2px; }
  .drawer .close { position: absolute; top: 14px; right: 14px; }
  .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin: 14px 0; }
  .attr .k { color: var(--text-muted); font-size: 11.5px; }
  .attr .v { font-size: 13px; margin-top: 1px; overflow-wrap: anywhere; }
  .drawer h4 { font-size: 13px; margin: 18px 0 6px; color: var(--text-secondary); font-weight: 600; }

  /* ---------- processes ---------- */
  .proc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .proc-card { cursor: pointer; }
  .proc-card:hover { background: var(--wash); }
  .proc-card h3 { margin: 0 0 2px; font-size: 14.5px; }
  .proc-card .pmeta { color: var(--text-muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
  .crit { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; display: inline-flex; align-items: center; gap: 4px; }
  .crit-Critical { background: color-mix(in srgb, var(--st-crit) 13%, transparent); }
  .crit-High { background: color-mix(in srgb, var(--st-warn) 18%, transparent); }
  .crit-Medium { background: var(--wash); }
  .lineage { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; margin-top: 14px; }
  @media (max-width: 800px) { .lineage { grid-template-columns: 1fr; } }
  .lin-col h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .lin-item {
    display: flex; justify-content: space-between; gap: 8px; align-items: center; width: 100%; text-align: left;
    background: none; font: inherit; border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; margin-bottom: 6px; cursor: pointer; color: var(--text-primary);
  }
  .lin-item:hover { background: var(--wash); }
  .lin-item .nm { font-size: 13px; font-weight: 550; }
  .lin-item .mt { color: var(--text-muted); font-size: 11.5px; }
  .lin-node { border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; text-align: center; align-self: center; background: var(--wash); min-width: 170px; }
  .lin-node .nm { font-weight: 650; }
  .lin-node .mt { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .back-link { background: none; border: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 10px; }
  .empty { color: var(--text-muted); padding: 30px 0; text-align: center; }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>

"use strict";
/* ============================ data loading ============================ */
function parseCSV(text) {
  const rows = []; let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); field = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const head = rows.shift();
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""])));
}
const csvText = id => document.getElementById(id).textContent.trim();
const PROCS = parseCSV(csvText("csv-processes"));
const INPUTS = parseCSV(csvText("csv-inputs"));
const OUTPUTS = parseCSV(csvText("csv-outputs"));
const HIST = parseCSV(csvText("csv-history"));

const procById = new Map(PROCS.map(p => [p.process_id, p]));
const POINTS = [
  ...INPUTS.map(r => ({
    id: r.data_point_id, name: r.name, dir: "input", type: r.type, format: r.format,
    endpoint: r.source_system, endpointLabel: "Source system",
    party: r.provider, partyLabel: "Provider",
    freq: r.frequency, expected: r.expected_arrival_ct, sla: r.sla_ct,
    avgMb: +r.avg_size_mb, avgRec: +r.avg_record_count,
    procIds: r.consumed_by_processes.split("|").filter(Boolean), contact: r.contact,
  })),
  ...OUTPUTS.map(r => ({
    id: r.data_point_id, name: r.name, dir: "output", type: r.type, format: r.format,
    endpoint: r.destination, endpointLabel: "Destination",
    party: r.consumers, partyLabel: "Consumers",
    freq: r.frequency, expected: r.expected_delivery_ct, sla: r.sla_ct,
    avgMb: +r.avg_size_mb, avgRec: +r.avg_record_count,
    procIds: r.produced_by_process.split("|").filter(Boolean), contact: r.contact,
  })),
];
const pointById = new Map(POINTS.map(p => [p.id, p]));
const histByPoint = new Map();
for (const h of HIST) {
  if (!histByPoint.has(h.data_point_id)) histByPoint.set(h.data_point_id, []);
  histByPoint.get(h.data_point_id).push({ date: h.date, size: +h.size_mb, rec: +h.record_count, time: h.actual_time_ct, status: h.status });
}
const ALL_DATES = [...new Set(HIST.map(h => h.date))].sort();
const MAX_DATE = ALL_DATES[ALL_DATES.length - 1];

/* ============================ state ============================ */
const state = { view: "overview", range: 30, dir: "all", q: "", type: "all", freq: "all", proc: "all",
                sortKey: "id", sortDir: 1, procSel: null };

/* ============================ helpers ============================ */
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLORS = () => ({ in: css("--series-in"), out: css("--series-out"),
  good: css("--st-good"), warn: css("--st-warn"), crit: css("--st-crit"),
  grid: css("--grid"), axis: css("--axis"), muted: css("--text-muted"), surface: css("--surface-1") });
const STATUS_META = { on_time: { label: "On time", icon: "✓", col: "good" }, late: { label: "Late", icon: "!", col: "warn" }, missed: { label: "Missed", icon: "✕", col: "crit" } };
function fmtMB(mb) {
  if (mb >= 1024) return (mb / 1024).toFixed(mb >= 10240 ? 0 : 1) + " GB";
  if (mb >= 10) return Math.round(mb) + " MB";
  if (mb >= 1) return mb.toFixed(1) + " MB";
  return (mb * 1024).toFixed(0) + " KB";
}
function fmtCount(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
  return String(n);
}
const fmtGB = mb => (mb / 1024).toFixed(1);
function shortDate(d) { const [, m, day] = d.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m - 1] + " " + +day; }
function rangeDates(days) { return ALL_DATES.filter(d => ALL_DATES.indexOf(d) >= ALL_DATES.length - businessCount(days)); }
function businessCount(days) { // approx business days within calendar range
  return ALL_DATES.filter(d => daysBetween(d, MAX_DATE) < days).length;
}
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function niceTicks(max, n = 4) {
  if (max <= 0) return [0, 1];
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(s => s * n >= max) || 10 * mag;
  const ticks = []; for (let v = 0; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(6));
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}

/* ============================ filtering ============================ */
function procNameMatch(p, q) {
  return p.procIds.some(id => { const pr = procById.get(id); return pr && (pr.process_name.toLowerCase().includes(q) || id.toLowerCase().includes(q)); });
}
function filteredPoints() {
  const q = state.q.trim().toLowerCase();
  return POINTS.filter(p => {
    if (state.dir !== "all" && p.dir !== state.dir) return false;
    if (state.type !== "all" && p.type !== state.type) return false;
    if (state.freq !== "all" && baseFreq(p.freq) !== state.freq) return false;
    if (state.proc !== "all" && !p.procIds.includes(state.proc)) return false;
    if (q) {
      const hay = [p.id, p.name, p.type, p.format, p.endpoint, p.party, p.contact, p.freq].join(" ").toLowerCase();
      if (!hay.includes(q) && !procNameMatch(p, q)) return false;
    }
    return true;
  });
}
const baseFreq = f => f.split(" ")[0].replace(/[^A-Za-z]/g, "");
function histIn(p, days) {
  const cutoff = days;
  return (histByPoint.get(p.id) || []).filter(h => daysBetween(h.date, MAX_DATE) < cutoff);
}

/* ============================ tiny svg builders ============================ */
const SVG = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function sparkline(values, w = 120, h = 30, color) {
  const c = COLORS(); color = color || c.muted;
  const svg = svgEl("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, "aria-hidden": "true" });
  if (!values.length) return svg;
  const max = Math.max(...values, 1e-9), min = Math.min(...values, 0);
  const x = i => values.length === 1 ? w / 2 : (i / (values.length - 1)) * (w - 6) + 3;
  const y = v => h - 3 - ((v - min) / (max - min || 1)) * (h - 8);
  const d = values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  svg.appendChild(svgEl("path", { d, fill: "none", stroke: color, "stroke-width": 1.6, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.65 }));
  const last = values.length - 1;
  svg.appendChild(svgEl("circle", { cx: x(last), cy: y(values[last]), r: 2.6, fill: css("--accent") }));
  return svg;
}

/* Line chart with crosshair + shared tooltip + table twin */
function lineChart(card, opts) {
  // opts: {title, sub, series:[{name,color,values:[num per date]}], dates, unit, fmt}
  card.textContent = "";
  const head = el("div", "chart-head");
  const hl = el("div");
  hl.appendChild(el("h3", null, opts.title));
  if (opts.sub) hl.appendChild(el("div", "csub", opts.sub));
  head.appendChild(hl);
  const tbtn = el("button", "tbl-toggle", "Table");
  head.appendChild(tbtn);
  card.appendChild(head);

  if (opts.series.length >= 2) {
    const leg = el("div", "legend");
    for (const s of opts.series) {
      const li = el("span", "li");
      const k = el("span", "lkey"); k.style.background = s.color;
      li.appendChild(k); li.appendChild(document.createTextNode(s.name));
      leg.appendChild(li);
    }
    card.appendChild(leg);
  }

  const body = el("div", "chart-body");
  card.appendChild(body);
  const W = 560, H = 240, ML = 44, MR = 26, MT = 12, MB = 26;
  const iw = W - ML - MR, ih = H - MT - MB;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  body.appendChild(svg);
  const c = COLORS();
  const n = opts.dates.length;
  const allVals = opts.series.flatMap(s => s.values);
  const maxV = Math.max(...allVals, 1e-9);
  const ticks = niceTicks(maxV);
  const top = ticks[ticks.length - 1];
  const X = i => ML + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => MT + ih - (v / top) * ih;

  for (const t of ticks) {
    svg.appendChild(svgEl("line", { x1: ML, x2: W - MR, y1: Y(t), y2: Y(t), stroke: t === 0 ? c.axis : c.grid, "stroke-width": 1 }));
    const lbl = svgEl("text", { x: ML - 7, y: Y(t) + 3.5, "text-anchor": "end", "font-size": 10.5, fill: c.muted, style: "font-variant-numeric: tabular-nums" });
    lbl.textContent = t >= 1000 ? t.toLocaleString() : String(t);
    svg.appendChild(lbl);
  }
  const xtickEvery = Math.max(1, Math.ceil(n / 7));
  opts.dates.forEach((d, i) => {
    const isLast = i === n - 1;
    const regular = i % xtickEvery === 0 && (isLast || i + xtickEvery <= n - 1); // skip a regular tick crowding the last
    if (!regular && !isLast) return;
    const lbl = svgEl("text", { x: isLast ? Math.min(X(i), W - 4) : X(i), y: H - 8, "text-anchor": isLast ? "end" : "middle", "font-size": 10.5, fill: c.muted });
    lbl.textContent = shortDate(d);
    svg.appendChild(lbl);
  });

  for (const s of opts.series) {
    const d = s.values.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
    svg.appendChild(svgEl("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const li = s.values.length - 1;
    svg.appendChild(svgEl("circle", { cx: X(li), cy: Y(s.values[li]), r: 4, fill: s.color, stroke: c.surface, "stroke-width": 2 }));
  }

  // crosshair + tooltip
  const cross = svgEl("line", { y1: MT, y2: MT + ih, stroke: c.axis, "stroke-width": 1, visibility: "hidden" });
  svg.appendChild(cross);
  const tip = el("div", "tooltip");
  body.appendChild(tip);
  function showTip(i, clientX) {
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
    cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    tip.appendChild(el("div", "tt-date", shortDate(opts.dates[i])));
    for (const s of opts.series) {
      const row = el("div", "tt-row");
      const k = el("span", "lkey"); k.style.background = s.color;
      row.appendChild(k);
      row.appendChild(el("span", "tt-name", s.name));
      row.appendChild(el("span", "tt-val", opts.fmt(s.values[i])));
      tip.appendChild(row);
    }
    tip.style.display = "block";
    const bw = body.clientWidth, rect = body.getBoundingClientRect();
    const px = (X(i) / W) * bw;
    tip.style.left = Math.min(bw - tip.offsetWidth - 4, Math.max(4, px + 12)) + "px";
    tip.style.top = "16px";
  }
  svg.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect();
    const fx = ((ev.clientX - rect.left) / rect.width) * W;
    let best = 0, bd = 1e9;
    for (let i = 0; i < n; i++) { const d = Math.abs(X(i) - fx); if (d < bd) { bd = d; best = i; } }
    showTip(best, ev.clientX);
  });
  svg.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });

  // table twin
  const tblWrap = el("div"); tblWrap.style.display = "none";
  const tbl = el("table", "data-table");
  const thr = el("tr"); thr.appendChild(el("th", null, "Date"));
  for (const s of opts.series) thr.appendChild(el("th", null, s.name + (opts.unit ? ` (${opts.unit})` : "")));
  const thead = el("thead"); thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  opts.dates.forEach((d, i) => {
    const tr = el("tr"); tr.appendChild(el("td", null, shortDate(d)));
    for (const s of opts.series) tr.appendChild(el("td", null, opts.fmt(s.values[i])));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tblWrap.appendChild(tbl);
  tblWrap.style.maxHeight = "240px"; tblWrap.style.overflowY = "auto";
  card.appendChild(tblWrap);
  tbtn.addEventListener("click", () => {
    const showTbl = tblWrap.style.display === "none";
    tblWrap.style.display = showTbl ? "block" : "none";
    body.style.display = showTbl ? "none" : "block";
    tbtn.textContent = showTbl ? "Chart" : "Table";
  });
}

/* Stacked status bars + table twin */
function statusChart(card, dates, perDay) {
  card.textContent = "";
  const c = COLORS();
  const head = el("div", "chart-head");
  const hl = el("div");
  hl.appendChild(el("h3", null, "Arrival & delivery status by day"));
  hl.appendChild(el("div", "csub", "Count of data point runs per batch date"));
  head.appendChild(hl);
  const tbtn = el("button", "tbl-toggle", "Table");
  head.appendChild(tbtn);
  card.appendChild(head);

  const leg = el("div", "legend");
  for (const key of ["on_time", "late", "missed"]) {
    const m = STATUS_META[key];
    const li = el("span", "li");
    const k = el("span", "lswatch"); k.style.background = c[m.col];
    li.appendChild(k);
    li.appendChild(document.createTextNode(`${m.icon} ${m.label}`));
    leg.appendChild(li);
  }
  card.appendChild(leg);

  const body = el("div", "chart-body");
  card.appendChild(body);
  const W = 560, H = 240, ML = 34, MR = 14, MT = 12, MB = 26;
  const iw = W - ML - MR, ih = H - MT - MB;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  body.appendChild(svg);
  const n = dates.length;
  const maxTot = Math.max(...perDay.map(d => d.on_time + d.late + d.missed), 1);
  const ticks = niceTicks(maxTot);
  const top = ticks[ticks.length - 1];
  const Y = v => MT + ih - (v / top) * ih;
  const slot = iw / n;
  const bw = Math.min(24, Math.max(3, slot - 4));
  for (const t of ticks) {
    svg.appendChild(svgEl("line", { x1: ML, x2: W - MR, y1: Y(t), y2: Y(t), stroke: t === 0 ? c.axis : c.grid, "stroke-width": 1 }));
    const lbl = svgEl("text", { x: ML - 7, y: Y(t) + 3.5, "text-anchor": "end", "font-size": 10.5, fill: c.muted, style: "font-variant-numeric: tabular-nums" });
    lbl.textContent = String(t);
    svg.appendChild(lbl);
  }
  const xtickEvery = Math.max(1, Math.ceil(n / 7));
  const tip = el("div", "tooltip");
  body.appendChild(tip);

  dates.forEach((d, i) => {
    const x = ML + i * slot + (slot - bw) / 2;
    if (i % xtickEvery === 0 || i === n - 1) {
      const lbl = svgEl("text", { x: ML + i * slot + slot / 2, y: H - 8, "text-anchor": "middle", "font-size": 10.5, fill: c.muted });
      lbl.textContent = shortDate(d);
      svg.appendChild(lbl);
    }
    let acc = 0; const day = perDay[i];
    const g = svgEl("g", { cursor: "default" });
    const order = ["on_time", "late", "missed"];
    order.forEach((key, si) => {
      const v = day[key]; if (!v) { return; }
      const y0 = Y(acc), y1 = Y(acc + v);
      const gap = si > 0 && acc > 0 ? 1 : 0; // 2px total gap in viewBox units ~1px here
      const isTopSeg = acc + v >= day.on_time + day.late + day.missed - 1e-9;
      const hgt = Math.max(0.5, y0 - y1 - (gap ? 2 : 0));
      const r = isTopSeg ? Math.min(4, bw / 2, hgt) : 0;
      const yTop = y1 + (gap ? 2 : 0);
      let path;
      if (r > 0) {
        path = `M${x} ${y0} L${x} ${yTop + r} Q${x} ${yTop} ${x + r} ${yTop} L${x + bw - r} ${yTop} Q${x + bw} ${yTop} ${x + bw} ${yTop + r} L${x + bw} ${y0} Z`;
      } else {
        path = `M${x} ${y0} L${x} ${yTop} L${x + bw} ${yTop} L${x + bw} ${y0} Z`;
      }
      g.appendChild(svgEl("path", { d: path, fill: c[STATUS_META[key].col] }));
      acc += v;
    });
    // transparent hit area
    const hit = svgEl("rect", { x: ML + i * slot, y: MT, width: slot, height: ih, fill: "transparent" });
    hit.addEventListener("pointermove", () => {
      tip.textContent = "";
      tip.appendChild(el("div", "tt-date", shortDate(d)));
      for (const key of order) {
        const m = STATUS_META[key];
        const row = el("div", "tt-row");
        const k = el("span", "lswatch"); k.style.background = c[m.col];
        row.appendChild(k);
        row.appendChild(el("span", "tt-name", m.label));
        row.appendChild(el("span", "tt-val", String(day[key])));
        tip.appendChild(row);
      }
      tip.style.display = "block";
      const bwpx = body.clientWidth;
      const px = ((ML + i * slot + slot / 2) / W) * bwpx;
      tip.style.left = Math.min(bwpx - tip.offsetWidth - 4, Math.max(4, px + 10)) + "px";
      tip.style.top = "16px";
    });
    hit.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    svg.appendChild(g);
    svg.appendChild(hit);
  });

  const tblWrap = el("div"); tblWrap.style.display = "none";
  tblWrap.style.maxHeight = "240px"; tblWrap.style.overflowY = "auto";
  const tbl = el("table", "data-table");
  const thead = el("thead"); const thr = el("tr");
  ["Date", "On time", "Late", "Missed"].forEach(h => thr.appendChild(el("th", null, h)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  dates.forEach((d, i) => {
    const tr = el("tr");
    tr.appendChild(el("td", null, shortDate(d)));
    tr.appendChild(el("td", null, String(perDay[i].on_time)));
    tr.appendChild(el("td", null, String(perDay[i].late)));
    tr.appendChild(el("td", null, String(perDay[i].missed)));
    tb.appendChild(tr);
  });
  tbl.appendChild(tb); tblWrap.appendChild(tbl); card.appendChild(tblWrap);
  tbtn.addEventListener("click", () => {
    const showTbl = tblWrap.style.display === "none";
    tblWrap.style.display = showTbl ? "block" : "none";
    body.style.display = showTbl ? "none" : "block";
    tbtn.textContent = showTbl ? "Chart" : "Table";
  });
}

/* ============================ overview ============================ */
function renderOverview() {
  const pts = filteredPoints();
  const dates = rangeDates(state.range);
  const inPts = pts.filter(p => p.dir === "input"), outPts = pts.filter(p => p.dir === "output");
  const c = COLORS();

  // per-day aggregates
  const idx = new Map(dates.map((d, i) => [d, i]));
  const volIn = dates.map(() => 0), volOut = dates.map(() => 0);
  const st = dates.map(() => ({ on_time: 0, late: 0, missed: 0 }));
  let onT = 0, tot = 0, prevOnT = 0, prevTot = 0;
  for (const p of pts) {
    for (const h of histByPoint.get(p.id) || []) {
      const age = daysBetween(h.date, MAX_DATE);
      if (age < state.range) {
        const i = idx.get(h.date); if (i == null) continue;
        (p.dir === "input" ? volIn : volOut)[i] += h.size;
        st[i][h.status]++;
        tot++; if (h.status === "on_time") onT++;
      } else if (age < state.range * 2) {
        prevTot++; if (h.status === "on_time") prevOnT++;
      }
    }
  }
  const otPct = tot ? (onT / tot) * 100 : 0;
  const prevPct = prevTot ? (prevOnT / prevTot) * 100 : 0;
  const dailyIn = volIn.reduce((a, b) => a + b, 0) / (dates.length || 1);
  const dailyOut = volOut.reduce((a, b) => a + b, 0) / (dates.length || 1);

  // KPI row
  const row = document.getElementById("kpiRow");
  row.textContent = "";
  function tile(lbl, val, opts = {}) {
    const t = el("div", "card tile");
    t.appendChild(el("div", "lbl", lbl));
    t.appendChild(el("div", "val", val));
    if (opts.delta != null) {
      const up = opts.delta >= 0.05, down = opts.delta <= -0.05;
      const d = el("div", "delta " + (up ? "up" : down ? "down" : "flat"),
        (up ? "▲ " : down ? "▼ " : "· ") + Math.abs(opts.delta).toFixed(1) + " pts vs prior " + state.range + "d");
      t.appendChild(d);
    }
    if (opts.spark) t.appendChild(sparkline(opts.spark, 130, 26));
    row.appendChild(t);
  }
  tile("Input data points", String(inPts.length), { spark: null });
  tile("Output data points", String(outPts.length));
  tile("Processes involved", String(new Set(pts.flatMap(p => p.procIds)).size));
  tile("Avg inbound / day", fmtGB(dailyIn) + " GB", { spark: volIn.map(v => v) });
  tile("Avg outbound / day", fmtGB(dailyOut) + " GB", { spark: volOut.map(v => v) });
  tile("On-time rate", otPct.toFixed(1) + "%", { delta: prevTot ? otPct - prevPct : null });

  // volume chart
  const series = [];
  if (state.dir !== "output") series.push({ name: "Inbound", color: c.in, values: volIn.map(v => +(v / 1024).toFixed(2)) });
  if (state.dir !== "input") series.push({ name: "Outbound", color: c.out, values: volOut.map(v => +(v / 1024).toFixed(2)) });
  lineChart(document.getElementById("volCard"), {
    title: "Daily data volume (GB)",
    sub: series.length === 1 ? (series[0].name + " volume across the selected range") : "Total size of all data points processed per batch date",
    series, dates, unit: "GB", fmt: v => v.toFixed(2) + " GB",
  });

  statusChart(document.getElementById("stCard"), dates, st);

  // top points by avg size
  const items = pts.map(p => {
    const hs = histIn(p, state.range).filter(h => h.status !== "missed");
    const avg = hs.length ? hs.reduce((a, h) => a + h.size, 0) / hs.length : 0;
    return { p, avg };
  }).filter(i => i.avg > 0).sort((a, b) => b.avg - a.avg).slice(0, 10);
  topChart(document.getElementById("topCard"), items);
}

/* ============================ data point table ============================ */
const DP_COLS = [
  { k: "id", l: "ID" }, { k: "name", l: "Name" }, { k: "dir", l: "Direction" }, { k: "type", l: "Type" },
  { k: "endpoint", l: "Source / Destination" }, { k: "party", l: "Provider / Consumers" },
  { k: "freq", l: "Frequency" }, { k: "expected", l: "Expected (CT)" },
  { k: "avgMb", l: "Avg size", num: true }, { k: "avgRec", l: "Avg records", num: true },
  { k: "procs", l: "Processes" }, { k: "trend", l: "Size trend (" }, { k: "last", l: "Last run" },
];
function renderPoints() {
  const pts = filteredPoints();
  const sorted = [...pts].sort((a, b) => {
    let va, vb;
    switch (state.sortKey) {
      case "avgMb": va = a.avgMb; vb = b.avgMb; break;
      case "avgRec": va = a.avgRec; vb = b.avgRec; break;
      case "procs": va = a.procIds.length; vb = b.procIds.length; break;
      case "last": case "trend": va = a.id; vb = b.id; break;
      default: va = String(a[state.sortKey] ?? ""); vb = String(b[state.sortKey] ?? "");
    }
    return (va > vb ? 1 : va < vb ? -1 : 0) * state.sortDir;
  });
  document.getElementById("dpCount").textContent =
    `${pts.length} of ${POINTS.length} data points · click a row for details, history and trend`;
  const tbl = document.getElementById("dpTable");
  tbl.textContent = "";
  const thead = el("thead"); const thr = el("tr");
  for (const col of DP_COLS) {
    const th = el("th", null, col.k === "trend" ? `Size trend (${state.range}d)` : col.l);
    if (state.sortKey === col.k) {
      const a = el("span", "arr", state.sortDir > 0 ? " ▲" : " ▼");
      th.appendChild(a);
    }
    th.addEventListener("click", () => {
      if (state.sortKey === col.k) state.sortDir *= -1; else { state.sortKey = col.k; state.sortDir = 1; }
      renderPoints();
    });
    thr.appendChild(th);
  }
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  const c = COLORS();
  for (const p of sorted) {
    const tr = el("tr");
    tr.appendChild(el("td", "dp-id", p.id));
    const nameTd = el("td");
    nameTd.appendChild(el("div", "dp-name", p.name));
    nameTd.appendChild(el("div", "dp-id", p.format));
    tr.appendChild(nameTd);
    const dirTd = el("td");
    const b = el("span", "badge " + (p.dir === "input" ? "b-in" : "b-out"));
    const dot = el("span", "dot"); dot.style.background = p.dir === "input" ? c.in : c.out;
    b.appendChild(dot); b.appendChild(document.createTextNode(p.dir === "input" ? "Input" : "Output"));
    dirTd.appendChild(b); tr.appendChild(dirTd);
    tr.appendChild(el("td", null, p.type));
    tr.appendChild(el("td", null, p.endpoint));
    tr.appendChild(el("td", null, p.party));
    tr.appendChild(el("td", null, p.freq));
    tr.appendChild(el("td", null, p.expected === "rolling" ? "rolling" : p.expected));
    const s1 = el("td", "num", fmtMB(p.avgMb)); tr.appendChild(s1);
    tr.appendChild(el("td", "num", p.avgRec ? fmtCount(p.avgRec) : "—"));
    const procTd = el("td");
    for (const pid of p.procIds) {
      const pr = procById.get(pid);
      const chip = el("button", "chip", pr ? pr.process_name : pid);
      chip.title = pid;
      chip.addEventListener("click", ev => { ev.stopPropagation(); showProcess(pid); });
      procTd.appendChild(chip);
    }
    tr.appendChild(procTd);
    const trendTd = el("td");
    const hs = histIn(p, state.range);
    trendTd.appendChild(sparkline(hs.map(h => h.size), 100, 24));
    tr.appendChild(trendTd);
    const lastTd = el("td");
    const last = hs[hs.length - 1];
    if (last) {
      const m = STATUS_META[last.status];
      const sc = el("span", "status-cell");
      const ic = el("span", "st-ic", m.icon); ic.style.color = c[m.col];
      sc.appendChild(ic); sc.appendChild(document.createTextNode(m.label));
      lastTd.appendChild(sc);
      lastTd.appendChild(el("div", "dp-id", shortDate(last.date) + (last.time ? " · " + last.time : "")));
    } else lastTd.appendChild(el("span", "muted", "—"));
    tr.appendChild(lastTd);
    tr.addEventListener("click", () => openDrawer(p.id));
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  if (!sorted.length) {
    const tr = el("tr"); const td = el("td", "empty", "No data points match the current filters.");
    td.colSpan = DP_COLS.length; tr.appendChild(td); tb.appendChild(tr);
  }
}

/* ============================ drawer ============================ */
function openDrawer(pid) {
  const p = pointById.get(pid); if (!p) return;
  const c = COLORS();
  const dr = document.getElementById("drawer");
  dr.textContent = "";
  const closeBtn = el("button", "ghost-btn close", "✕ Close");
  closeBtn.addEventListener("click", closeDrawer);
  dr.appendChild(closeBtn);
  const b = el("span", "badge " + (p.dir === "input" ? "b-in" : "b-out"));
  const dot = el("span", "dot"); dot.style.background = p.dir === "input" ? c.in : c.out;
  b.appendChild(dot); b.appendChild(document.createTextNode(p.dir === "input" ? "Input data point" : "Output data point"));
  dr.appendChild(b);
  dr.appendChild(el("h2", null, p.name));
  dr.appendChild(el("div", "dp-id", p.id));

  const grid = el("div", "attr-grid");
  const attrs = [
    ["Type", p.type], ["Format", p.format],
    [p.endpointLabel, p.endpoint], [p.partyLabel, p.party],
    ["Frequency", p.freq], [p.dir === "input" ? "Expected arrival (CT)" : "Expected delivery (CT)", p.expected],
    ["SLA (CT)", p.sla], ["Avg size", fmtMB(p.avgMb)],
    ["Avg records", p.avgRec ? fmtCount(p.avgRec) : "—"], ["Contact", p.contact],
  ];
  for (const [k, v] of attrs) {
    const a = el("div", "attr");
    a.appendChild(el("div", "k", k));
    a.appendChild(el("div", "v", v));
    grid.appendChild(a);
  }
  dr.appendChild(grid);

  dr.appendChild(el("h4", null, p.dir === "input" ? "Consumed by processes" : "Produced by process"));
  const chips = el("div");
  for (const prid of p.procIds) {
    const pr = procById.get(prid);
    const chip = el("button", "chip", (pr ? pr.process_name : prid) + " · " + prid);
    chip.addEventListener("click", () => { closeDrawer(); showProcess(prid); });
    chips.appendChild(chip);
  }
  dr.appendChild(chips);

  dr.appendChild(el("h4", null, `Historical trend — size per run (last ${state.range}d)`));
  const chartCard = el("div", "chart-card");
  dr.appendChild(chartCard);
  const hs = histIn(p, state.range);
  lineChart(chartCard, {
    title: "", sub: "",
    series: [{ name: p.name, color: p.dir === "input" ? c.in : c.out, values: hs.map(h => +h.size.toFixed(1)) }],
    dates: hs.map(h => h.date), unit: "MB", fmt: v => fmtMB(v),
  });
  chartCard.querySelector("h3").remove();

  dr.appendChild(el("h4", null, "Recent runs"));
  const tbl = el("table", "data-table");
  const thead = el("thead"); const thr = el("tr");
  ["Date", p.dir === "input" ? "Arrived (CT)" : "Delivered (CT)", "Size", "Records", "Status"].forEach(h => thr.appendChild(el("th", null, h)));
  thead.appendChild(thr); tbl.appendChild(thead);
  const tb = el("tbody");
  for (const h of hs.slice(-10).reverse()) {
    const tr = el("tr");
    tr.appendChild(el("td", null, shortDate(h.date)));
    tr.appendChild(el("td", null, h.time || "—"));
    tr.appendChild(el("td", null, h.status === "missed" ? "—" : fmtMB(h.size)));
    tr.appendChild(el("td", null, h.status === "missed" ? "—" : fmtCount(h.rec)));
    const m = STATUS_META[h.status];
    const td = el("td");
    const sc = el("span", "status-cell");
    const ic = el("span", "st-ic", m.icon); ic.style.color = c[m.col];
    sc.appendChild(ic); sc.appendChild(document.createTextNode(m.label));
    td.appendChild(sc); tr.appendChild(td);
    tb.appendChild(tr);
  }
  tbl.appendChild(tb); dr.appendChild(tbl);

  document.getElementById("veil").style.display = "block";
  dr.classList.add("open");
}
function closeDrawer() {
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("veil").style.display = "none";
}
document.getElementById("veil").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ============================ processes ============================ */
function renderProcs() {
  const list = document.getElementById("procList");
  const detail = document.getElementById("procDetail");
  if (state.procSel) { list.style.display = "none"; detail.style.display = "block"; renderProcDetail(state.procSel); return; }
  detail.style.display = "none"; list.style.display = "grid";
  list.textContent = "";
  const q = state.q.trim().toLowerCase();
  for (const pr of PROCS) {
    const ins = POINTS.filter(p => p.dir === "input" && p.procIds.includes(pr.process_id));
    const outs = POINTS.filter(p => p.dir === "output" && p.procIds.includes(pr.process_id));
    if (q && !(pr.process_name.toLowerCase().includes(q) || pr.process_id.toLowerCase().includes(q) ||
               pr.description.toLowerCase().includes(q) || pr.owner_team.toLowerCase().includes(q) ||
               [...ins, ...outs].some(p => p.name.toLowerCase().includes(q)))) continue;
    if (state.proc !== "all" && pr.process_id !== state.proc) continue;
    const card = el("div", "card proc-card");
    const top = el("div", "chart-head");
    const hl = el("div");
    hl.appendChild(el("h3", null, pr.process_name));
    hl.appendChild(el("div", "dp-id", pr.process_id));
    top.appendChild(hl);
    top.appendChild(el("span", "crit crit-" + pr.criticality, pr.criticality));
    card.appendChild(top);
    card.appendChild(el("div", "csub", pr.description));
    const meta = el("div", "pmeta");
    meta.appendChild(el("span", null, "⏱ " + pr.schedule_ct));
    meta.appendChild(el("span", null, "~" + pr.avg_runtime_min + " min"));
    meta.appendChild(el("span", null, pr.owner_team));
    meta.appendChild(el("span", null, `⇥ ${ins.length} in · ${outs.length} out`));
    card.appendChild(meta);
    card.addEventListener("click", () => showProcess(pr.process_id));
    list.appendChild(card);
  }
  if (!list.children.length) list.appendChild(el("div", "empty", "No processes match the current search."));
}
function showProcess(pid) {
  state.procSel = pid;
  state.view = "procs";
  syncTabs();
  renderAll();
  window.scrollTo({ top: 0 });
}
function renderProcDetail(pid) {
  const pr = procById.get(pid);
  const box = document.getElementById("procDetail");
  box.textContent = "";
  if (!pr) return;
  const back = el("button", "back-link", "← All processes");
  back.addEventListener("click", () => { state.procSel = null; renderProcs(); });
  box.appendChild(back);
  const card = el("div", "card");
  const head = el("div", "chart-head");
  const hl = el("div");
  hl.appendChild(el("h2", null, pr.process_name));
  hl.appendChild(el("div", "dp-id", pr.process_id + " · " + pr.owner_team + " · " + pr.schedule_ct + " · ~" + pr.avg_runtime_min + " min"));
  head.appendChild(hl);
  head.appendChild(el("span", "crit crit-" + pr.criticality, pr.criticality));
  card.appendChild(head);
  card.appendChild(el("div", "csub", pr.description));

  const ins = POINTS.filter(p => p.dir === "input" && p.procIds.includes(pid));
  const outs = POINTS.filter(p => p.dir === "output" && p.procIds.includes(pid));
  const lin = el("div", "lineage");
  const colIn = el("div", "lin-col");
  colIn.appendChild(el("h4", null, `Consumes — ${ins.length} input${ins.length === 1 ? "" : "s"}`));
  const c = COLORS();
  function linItem(p) {
    const it = el("button", "lin-item");
    const left = el("div");
    const nm = el("div", "nm");
    const dot = el("span"); dot.style.cssText = `display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:${p.dir === "input" ? c.in : c.out}`;
    nm.appendChild(dot); nm.appendChild(document.createTextNode(p.name));
    left.appendChild(nm);
    left.appendChild(el("div", "mt", `${p.id} · ${p.type} · ${p.freq} · avg ${fmtMB(p.avgMb)}`));
    it.appendChild(left);
    const hs = histIn(p, 30);
    const last = hs[hs.length - 1];
    if (last) {
      const m = STATUS_META[last.status];
      const ic = el("span", "st-ic", m.icon); ic.style.color = c[m.col]; ic.title = m.label;
      it.appendChild(ic);
    }
    it.addEventListener("click", () => openDrawer(p.id));
    return it;
  }
  ins.forEach(p => colIn.appendChild(linItem(p)));
  if (!ins.length) colIn.appendChild(el("div", "muted", "None"));
  const node = el("div", "lin-node");
  node.appendChild(el("div", "nm", pr.process_name));
  node.appendChild(el("div", "mt", pr.schedule_ct));
  node.appendChild(el("div", "mt", "runs ~" + pr.avg_runtime_min + " min"));
  const colOut = el("div", "lin-col");
  colOut.appendChild(el("h4", null, `Produces — ${outs.length} output${outs.length === 1 ? "" : "s"}`));
  outs.forEach(p => colOut.appendChild(linItem(p)));
  if (!outs.length) colOut.appendChild(el("div", "muted", "None"));
  lin.appendChild(colIn); lin.appendChild(node); lin.appendChild(colOut);
  card.appendChild(lin);
  box.appendChild(card);
}

/* ============================ wiring ============================ */
function syncTabs() {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === state.view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + state.view));
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.view = b.dataset.view;
  if (state.view !== "procs") state.procSel = null;
  syncTabs(); renderAll();
});
document.getElementById("rangeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.range = +b.dataset.r;
  document.querySelectorAll("#rangeSeg button").forEach(x => x.classList.toggle("on", x === b));
  renderAll();
});
document.getElementById("dirSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.dir = b.dataset.d;
  document.querySelectorAll("#dirSeg button").forEach(x => x.classList.toggle("on", x === b));
  renderAll();
});
for (const [id, key] of [["fType", "type"], ["fFreq", "freq"], ["fProc", "proc"]]) {
  document.getElementById(id).addEventListener("change", e => { state[key] = e.target.value; renderAll(); });
}
let qTimer;
document.getElementById("fSearch").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; renderAll(); }, 140);
});

// populate filter selects
(function initFilters() {
  const types = [...new Set(POINTS.map(p => p.type))].sort();
  const freqs = [...new Set(POINTS.map(p => baseFreq(p.freq)))].sort();
  const tSel = document.getElementById("fType");
  types.forEach(t => { const o = el("option", null, t); o.value = t; tSel.appendChild(o); });
  const fSel = document.getElementById("fFreq");
  freqs.forEach(f => { const o = el("option", null, f); o.value = f; fSel.appendChild(o); });
  const pSel = document.getElementById("fProc");
  PROCS.forEach(pr => { const o = el("option", null, pr.process_name); o.value = pr.process_id; pSel.appendChild(o); });
})();

// theme toggle
const themeBtn = document.getElementById("themeBtn");
const themes = ["auto", "light", "dark"];
let themeIdx = 0;
themeBtn.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % 3;
  const t = themes[themeIdx];
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  renderAll();
});

function renderAll() {
  const pts = filteredPoints();
  document.getElementById("filterHint").textContent =
    `${pts.length} data points · last ${state.range} business-day window ending ${shortDate(MAX_DATE)}`;
  if (state.view === "overview") renderOverview();
  if (state.view === "points") renderPoints();
  if (state.view === "procs") renderProcs();
}
syncTabs();
renderAll();
renderPoints(); // pre-render table so switching is instant
</script>
</body>
</html>
